# colorice — generated from {wallpaper}
# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{

[manager]
cwd = { fg = "{color6}" }

# Hovered
hovered         = { reversed = true }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "{color3}", bold = true, italic = true, underline = true }
find_position = { fg = "{color5.saturate_15}", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "{color2}", bg = "{color2}" }
marker_cut      = { fg = "{color1}", bg = "{color1}" }
marker_marked   = { fg = "{color6}", bg = "{color6}" }
marker_selected = { fg = "{color3}", bg = "{color3}" }

# Tab
tab_active   = { reversed = true }
tab_inactive = {}
tab_width    = 1

# Count
count_copied   = { fg = "{background}", bg = "{color2}" }
count_cut      = { fg = "{background}", bg = "{color1}" }
count_selected = { fg = "{background}", bg = "{color3}" }

# Border
border_symbol = "│"
border_style  = { fg = "{color8}" }

# : }}}


# : Status {{{

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "{color0}", bg = "{color0}" }

# Mode
mode_normal = { fg = "{background}", bg = "{color4}", bold = true }
mode_select = { fg = "{background}", bg = "{color2}", bold = true }
mode_unset  = { fg = "{background}", bg = "{color1.lighten_10}", bold = true }

# Progress
progress_label  = { fg = "{foreground}", bold = true }
progress_normal = { fg = "{color4}", bg = "{color0}" }
progress_error  = { fg = "{color1}", bg = "{color0}" }

# Permissions
permissions_t = { fg = "{color4}" }
permissions_r = { fg = "{color3}" }
permissions_w = { fg = "{color1}" }
permissions_x = { fg = "{color2}" }
permissions_s = { fg = "{color8}" }

# : }}}


# : Select {{{

[select]
border   = { fg = "{color4}" }
active   = { fg = "{color5.saturate_15}", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "{color4}" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[completion]
border = { fg = "{color4}" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "{color4}" }
title   = {}
hovered = { fg = "{color5.saturate_15}", underline = true }

# : }}}


# : Which {{{

[which]
mask            = { bg = "{color0}" }
cand            = { fg = "{color6}" }
rest            = { fg = "{color8.lighten_10}" }
desc            = { fg = "{color5.saturate_15}" }
separator       = "  "
separator_style = { fg = "{color8}" }

# : }}}


# : Help {{{

[help]
on      = { fg = "{color6}" }
run     = { fg = "{color5.saturate_15}" }
hovered = { reversed = true, bold = true }
footer  = { fg = "{color0}", bg = "{foreground}" }

# : }}}


# : Notify {{{

[notify]
title_info  = { fg = "{color2}" }
title_warn  = { fg = "{color3}" }
title_error = { fg = "{color1}" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "{color6}" },

	# Media
	{ mime = "{audio,video}/*", fg = "{color3}" },

	# Archives
	{ mime = "application/*zip", fg = "{color5.saturate_15}" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "{color5.saturate_15}" },

	# Documents
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "{color2}" },

	# Fallback
	{ name = "*", fg = "{foreground}" },
	{ name = "*/", fg = "{color4}" }
]

# : }}}
