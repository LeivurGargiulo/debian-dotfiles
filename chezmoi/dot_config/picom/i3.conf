backend = "glx";

vsync = false;
use-damage = true;
corner-radius = 12;

active-opacity = 0.9;
inactive-opacity = 0.75;

blur-method = "dual_kawase";
blur-strength = 5;

opacity-rule = [
    "100:class_g = 'zen-beta'",
    "100:class_g = 'discord'",
    "85:class_g = 'kitty'",
    "85:class_g = 'Thunar'"
];

shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.5;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

######################
# Animations
######################
animations = true;
animation-stiffness = 1000;
animation-dampening = 50;
animation-window-mass = 1;
animation-delta = 7;
animation-force-steps = true;

animation-for-open-window = "squeeze";
animation-for-unmap-window = "auto";
animation-for-transient-window = "slide-down";
animation-for-workspace-switch-in = "auto";
animation-for-workspace-switch-out = "auto";

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
];
