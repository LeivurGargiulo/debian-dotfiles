;==========================================================
;
;   POLYBAR CONFIG - CATPPUCCIN STYLE
;
;==========================================================

[colors]
rosewater = #f5e0dc
flamingo = #f2cdcd
pink = #f5c2e7
mauve = #cba6f7
red = #f38ba8
maroon = #eba0ac
peach = #fab387
yellow = #f9e2af
green = #a6e3a1
teal = #94e2d5
sky = #89dceb
sapphire = #74c7ec
blue = #89b4fa
lavender = #b4befe
text = #cdd6f4
subtext1 = #bac2de
subtext0 = #a6adc8
overlay2 = #9399b2
overlay1 = #7f849c
overlay0 = #6c7086
surface2 = #585b70
surface1 = #45475a
surface0 = #313244
base = #1e1e2e
mantle = #181825
crust = #11111b
transparent = #00000000

[bar/main]
width = 98%
height = 29
offset-x = 1%
offset-y = 10
fixed-center = true
bottom = false

override-redirect = true

background = ${colors.base}
foreground = ${colors.text}

line-size = 2
line-color = ${colors.blue}

border-size = 0
border-color = ${colors.transparent}

padding-left = 1
padding-right = 1

module-margin-left = 0
module-margin-right = 0

font-0 = "CaskaydiaCove Nerd Font:style=Bold:size=10;3"
font-1 = "CaskaydiaCove Nerd Font:size=12;3"
font-2 = "CaskaydiaCove Nerd Font:size=18;4"

modules-left = rofi i3 xwindow
modules-center = date
modules-right = pulseaudio memory cpu eth public-ip tray battery powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3

;==========================================================
; MODULES
;==========================================================

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

; --- FOCUSED WORKSPACE (Active) ---

label-focused = " %name% "
label-focused-background = ${colors.surface1}
label-focused-foreground = ${colors.mauve}
label-focused-padding = 0

; --- UNFOCUSED WORKSPACE (Inactive) ---
label-unfocused = " %name% "
label-unfocused-padding = 0
label-unfocused-background = ${colors.surface0}
label-unfocused-foreground = ${colors.overlay1}

; --- URGENT WORKSPACE (Alert) ---
label-urgent = " %name% "
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.base}
label-urgent-padding = 0

; --- VISIBLE WORKSPACE ---
label-visible = " %name% "
label-visible-padding = 0
label-visible-background = ${colors.surface0}
label-visible-foreground = ${colors.text}

[module/rofi]
type = custom/text

content = " 󰄛 "
content-background = ${colors.surface0}
content-foreground = ${colors.mauve}

click-left = rofi -show drun -show-icons

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %d-%m-%Y %H:%M:%S
label = %date%
label-foreground = ${colors.text}
format-prefix = "  "
format-prefix-foreground = ${colors.teal}
format-background = ${colors.surface0}
format-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
format-volume-background = ${colors.surface0}
format-volume-padding = 1
format-muted-background = ${colors.surface0}
format-muted-padding = 1
label-volume = %percentage%%
label-volume-foreground = ${colors.text}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.blue}
label-muted = 󰝟 Muted
label-muted-foreground = ${colors.overlay0}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.peach}
format-background = ${colors.surface0}
format-padding = 1
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.red}
format-background = ${colors.surface0}
format-padding = 1
label = %percentage:2%%

[module/eth]
type = internal/network
interface-type = wired
interval = 3.0

format-connected = <label-connected>
format-connected-prefix = "󰈀 "
format-connected-prefix-foreground = ${colors.green}
format-connected-background = ${colors.surface0}
format-connected-padding = 1
label-connected = %local_ip%
label-connected-foreground = ${colors.text}

format-disconnected = <label-disconnected>
format-disconnected-background = ${colors.surface0}
format-disconnected-padding = 1
label-disconnected = "󰈂 offline"
label-disconnected-foreground = ${colors.red}

[module/public-ip]
type = custom/script
exec = ~/.config/polybar/scripts/ip_monitor.sh
tail = true

label = " %output% "
label-foreground = ${colors.text}
label-background = ${colors.surface0}

; Left click: copy IP
click-left = kill -USR1 %pid%
; Right click: Info
click-right = kill -USR2 %pid%

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 98
low-at = 20

format-full = <ramp-capacity> <label-full>
format-full-background = ${colors.surface0}
format-full-padding = 1
label-full = %percentage%%
label-full-foreground = ${colors.text}

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-charging-background = ${colors.surface0}
format-charging-padding = 1
format-discharging-background = ${colors.surface0}
format-discharging-padding = 1

label-charging = %percentage%%
label-discharging = %percentage%%

format-low = <animation-low> <label-low>
format-low-background = ${colors.surface0}
format-low-padding = 1
label-low = %percentage%%
label-low-foreground = ${colors.red}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.green}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.flamingo}
animation-charging-framerate = 750

animation-low-0 = 
animation-low-1 = 󱃍
animation-low-foreground = ${colors.red}
animation-low-framerate = 750

[module/powermenu]
type = custom/text
label = "   "
label-foreground = ${colors.red}
label-background = ${colors.surface0}
click-left = ~/.local/share/rofi/scripts/powermenu.sh

[module/tray]
type = internal/tray
tray-padding = 2
tray-size = 65%
tray-background = ${colors.surface0}

[module/xwindow]
type = internal/xwindow
label = " %title:0:60:...% "
label-maxlen = 60
label-foreground = ${colors.text}
label-background = ${colors.surface0}
label-padding = 0
label-margin = 0
