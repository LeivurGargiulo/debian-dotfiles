# RiceOrange (Windows Terminal scheme, gamdias WSL)
palette = "rice_orange"

[palettes.rice_orange]
rosewater = "#FFB768"
flamingo = "#FFC670"
pink = "#FF9F40"
mauve = "#FF7A00"
red = "#FF4500"
maroon = "#CC2400"
peach = "#FF9F40"
yellow = "#FFB347"
green = "#B8D18A"
teal = "#FF6A33"
sky = "#C9C9C9"
sapphire = "#9A9A9A"
blue = "#6E6E6E"
lavender = "#FFB768"
text = "#E8E8E8"
base = "#0A0A0A"
surface0 = "#3A3A3A"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[directory]
style = "bold blue"

[git_branch]
style = "bold mauve"
