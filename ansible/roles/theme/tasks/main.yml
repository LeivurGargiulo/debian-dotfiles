---
- name: Install base theme packages (Papirus, JetBrains Mono)
  ansible.builtin.apt:
    name: "{{ theme_packages }}"
    state: present

- name: Clone catppuccin-papirus-folders
  ansible.builtin.git:
    repo: https://github.com/catppuccin/papirus-folders.git
    dest: /tmp/catppuccin-papirus-folders
    depth: 1

- name: Install Catppuccin Papirus folder color assets
  ansible.builtin.copy:
    src: /tmp/catppuccin-papirus-folders/src/
    dest: /usr/share/icons/Papirus/
    remote_src: true

- name: Fetch papirus-folders script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/PapirusDevelopmentTeam/papirus-folders/master/papirus-folders
    dest: /usr/local/bin/papirus-folders
    mode: "0755"

- name: Set Catppuccin Mocha Mauve Papirus folder color
  ansible.builtin.command: papirus-folders -C cat-mocha-mauve --theme Papirus-Dark

- name: Fetch Catppuccin Mocha Mauve cursor theme
  ansible.builtin.get_url:
    url: https://github.com/catppuccin/cursors/releases/download/v2.0.0/catppuccin-mocha-mauve-cursors.zip
    dest: /tmp/catppuccin-mocha-mauve-cursors.zip
    mode: "0644"

- name: Install Catppuccin Mocha Mauve cursor theme
  ansible.builtin.unarchive:
    src: /tmp/catppuccin-mocha-mauve-cursors.zip
    dest: /usr/share/icons/
    remote_src: true
    creates: /usr/share/icons/catppuccin-mocha-mauve-cursors

- name: Fetch Catppuccin Plasma color scheme
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/catppuccin/kde/main/generated/color-schemes/CatppuccinMochaMauve.colors
    dest: /usr/share/color-schemes/CatppuccinMochaMauve.colors
    mode: "0644"

- name: Apply Catppuccin Mocha color scheme
  ansible.builtin.command: plasma-apply-colorscheme CatppuccinMochaMauve
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ invoking_uid }}"
    WAYLAND_DISPLAY: "wayland-0"

- name: Fetch a Catppuccin Mocha wallpaper
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/iQuickDev/catppuccin-wallpapers/master/minimalistic/mauve-cat.png
    dest: /usr/share/wallpapers/catppuccin-mocha.png
    mode: "0644"

- name: Apply wallpaper
  ansible.builtin.command: plasma-apply-wallpaperimage /usr/share/wallpapers/catppuccin-mocha.png
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ invoking_uid }}"
    WAYLAND_DISPLAY: "wayland-0"

- name: Clone catppuccin-kde (Global Theme, window decoration, splash)
  ansible.builtin.git:
    repo: https://github.com/catppuccin/kde.git
    dest: /tmp/catppuccin-kde
    depth: 1
  become: false
  register: catppuccin_kde_clone

- name: Install and apply Catppuccin Mocha Global Theme (panels, window decoration, splash)
  ansible.builtin.command: sh install.sh -q -n 1 4 1 auto
  args:
    chdir: /tmp/catppuccin-kde
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ invoking_uid }}"
    WAYLAND_DISPLAY: "wayland-0"
  when: catppuccin_kde_clone.changed

- name: Create Kvantum theme directory
  ansible.builtin.file:
    path: "{{ invoking_home }}/.config/Kvantum/catppuccin-mocha-mauve"
    state: directory
    mode: "0755"
  become: false

- name: Fetch Catppuccin Kvantum theme files
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/catppuccin/kvantum/main/themes/catppuccin-mocha-mauve/{{ item }}"
    dest: "{{ invoking_home }}/.config/Kvantum/catppuccin-mocha-mauve/{{ item }}"
    mode: "0644"
  become: false
  loop:
    - catppuccin-mocha-mauve.kvconfig
    - catppuccin-mocha-mauve.svg

- name: Set Kvantum as the active widget style
  ansible.builtin.command: kwriteconfig6 --file kdeglobals --group KDE --key widgetStyle kvantum
  become: false
  changed_when: true

- name: Select Catppuccin theme in Kvantum
  community.general.ini_file:
    path: "{{ invoking_home }}/.config/Kvantum/kvantum.kvconfig"
    section: General
    option: theme
    value: catppuccin-mocha-mauve
    mode: "0644"
  become: false

- name: Fetch Catppuccin SDDM login theme
  ansible.builtin.get_url:
    url: https://github.com/catppuccin/sddm/releases/download/v1.1.2/catppuccin-mocha-mauve-sddm.zip
    dest: /tmp/catppuccin-mocha-mauve-sddm.zip
    mode: "0644"

- name: Extract Catppuccin SDDM login theme
  ansible.builtin.unarchive:
    src: /tmp/catppuccin-mocha-mauve-sddm.zip
    dest: /usr/share/sddm/themes/
    remote_src: true
    creates: /usr/share/sddm/themes/catppuccin-mocha-mauve

- name: Set Catppuccin as the SDDM login theme
  ansible.builtin.copy:
    dest: /etc/sddm.conf.d/theme.conf
    content: |
      [Theme]
      Current=catppuccin-mocha-mauve
    mode: "0644"

- name: Fetch Catppuccin Konsole colorscheme
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/catppuccin/konsole/main/themes/catppuccin-mocha.colorscheme
    dest: "{{ invoking_home }}/.local/share/konsole/catppuccin-mocha.colorscheme"
    mode: "0644"
  become: false

- name: Install Catppuccin Konsole profile
  ansible.builtin.copy:
    dest: "{{ invoking_home }}/.local/share/konsole/Catppuccin-Mocha.profile"
    content: |
      [Appearance]
      ColorScheme=catppuccin-mocha

      [General]
      Name=Catppuccin-Mocha
      Parent=FALLBACK/
    mode: "0644"
  become: false

- name: Set Catppuccin as Konsole's default profile
  ansible.builtin.command: kwriteconfig6 --file konsolerc --group "Desktop Entry" --key DefaultProfile Catppuccin-Mocha.profile
  become: false
  changed_when: true

- name: Create GTK theme directory
  ansible.builtin.file:
    path: "{{ invoking_home }}/.local/share/themes"
    state: directory
    mode: "0755"
  become: false

- name: Fetch Catppuccin GTK theme
  ansible.builtin.get_url:
    url: "https://github.com/catppuccin/gtk/releases/download/v1.0.3/catppuccin-mocha-mauve-standard+default.zip"
    dest: /tmp/catppuccin-mocha-mauve-gtk.zip
    mode: "0644"

- name: Extract Catppuccin GTK theme
  ansible.builtin.unarchive:
    src: /tmp/catppuccin-mocha-mauve-gtk.zip
    dest: "{{ invoking_home }}/.local/share/themes/"
    remote_src: true
    creates: "{{ invoking_home }}/.local/share/themes/catppuccin-mocha-mauve-standard+default"
  become: false

- name: Create GTK settings directories
  ansible.builtin.file:
    path: "{{ invoking_home }}/.config/{{ item }}"
    state: directory
    mode: "0755"
  become: false
  loop:
    - gtk-3.0
    - gtk-4.0

- name: Apply Catppuccin GTK theme to GTK3 apps
  community.general.ini_file:
    path: "{{ invoking_home }}/.config/gtk-3.0/settings.ini"
    section: Settings
    option: gtk-theme-name
    value: catppuccin-mocha-mauve-standard+default
    mode: "0644"
  become: false

- name: Apply Catppuccin GTK theme to GTK4 apps
  community.general.ini_file:
    path: "{{ invoking_home }}/.config/gtk-4.0/settings.ini"
    section: Settings
    option: gtk-theme-name
    value: catppuccin-mocha-mauve-standard+default
    mode: "0644"
  become: false
