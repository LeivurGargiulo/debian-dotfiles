---
- name: Install base theme packages (Papirus, Kvantum)
  ansible.builtin.apt:
    name: "{{ theme_packages }}"
    state: present

- name: Copy catppuccin theme files into place
  ansible.builtin.copy:
    src: "catppuccin/"
    dest: "{{ invoking_home }}/"
    mode: preserve
  become: false

- name: Create fonts directory
  ansible.builtin.file:
    path: "{{ invoking_home }}/.local/share/fonts"
    state: directory
    mode: "0755"
  become: false

- name: Fetch CaskaydiaCove Nerd Font
  ansible.builtin.get_url:
    url: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/CascadiaCode.zip
    dest: /tmp/CascadiaCode-nerd-font.zip
    mode: "0644"

- name: Install CaskaydiaCove Nerd Font
  ansible.builtin.unarchive:
    src: /tmp/CascadiaCode-nerd-font.zip
    dest: "{{ invoking_home }}/.local/share/fonts"
    remote_src: true
    creates: "{{ invoking_home }}/.local/share/fonts/CaskaydiaCoveNerdFont-Regular.ttf"
  become: false

- name: Refresh font cache
  ansible.builtin.command: fc-cache -f
  become: false

- name: Create local icons directory
  ansible.builtin.file:
    path: "{{ invoking_home }}/.local/share/icons"
    state: directory
    mode: "0755"
  become: false

- name: Fetch catppuccin cursor theme
  ansible.builtin.get_url:
    url: "https://github.com/catppuccin/cursors/releases/download/v2.0.0/catppuccin-mocha-mauve-cursors.zip"
    dest: "/tmp/catppuccin-mocha-mauve-cursors.zip"
    mode: "0644"

- name: Install catppuccin cursor theme
  ansible.builtin.unarchive:
    src: "/tmp/catppuccin-mocha-mauve-cursors.zip"
    dest: "{{ invoking_home }}/.local/share/icons/"
    remote_src: true
    creates: "{{ invoking_home }}/.local/share/icons/catppuccin-mocha-mauve-cursors"
  become: false

- name: Set X cursor default via ~/.icons/default
  ansible.builtin.file:
    path: "{{ invoking_home }}/.icons/default"
    state: directory
    mode: "0755"
  become: false

- name: Point ~/.icons/default at the mauve cursor pack
  ansible.builtin.copy:
    dest: "{{ invoking_home }}/.icons/default/index.theme"
    content: |
      [Icon Theme]
      Inherits=catppuccin-mocha-mauve-cursors
    mode: "0644"
  become: false

- name: Set GTK cursor-theme via gsettings
  ansible.builtin.command: >
    gsettings set org.gnome.desktop.interface cursor-theme
    catppuccin-mocha-mauve-cursors
  become: false
  environment:
    DISPLAY: ":0"
  changed_when: true
  failed_when: false

# --- catppuccin-only: fetch the upstream assets orange already vendors ---

- name: Clone catppuccin-papirus-folders
  ansible.builtin.git:
    repo: https://github.com/catppuccin/papirus-folders.git
    dest: /tmp/catppuccin-papirus-folders
    depth: 1

- name: Install Catppuccin Papirus folder color assets
  ansible.builtin.copy:
    src: /tmp/catppuccin-papirus-folders/src/
    dest: /usr/share/icons/Papirus/
    remote_src: true

- name: Fetch papirus-folders script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/PapirusDevelopmentTeam/papirus-folders/master/papirus-folders
    dest: /usr/local/bin/papirus-folders
    mode: "0755"

- name: Set Papirus folder color (mocha-mauve)
  ansible.builtin.command: papirus-folders -C cat-mocha-mauve --theme Papirus-Dark

- name: Select Catppuccin theme in Kvantum
  community.general.ini_file:
    path: "{{ invoking_home }}/.config/Kvantum/kvantum.kvconfig"
    section: General
    option: theme
    value: catppuccin-mocha-mauve
    mode: "0644"
  become: false

- name: Set Kvantum as the qt5ct widget style
  community.general.ini_file:
    path: "{{ invoking_home }}/.config/qt5ct/qt5ct.conf"
    section: Appearance
    option: style
    value: kvantum
    mode: "0644"
  become: false

- name: Select the Catppuccin qt5ct color scheme
  community.general.ini_file:
    path: "{{ invoking_home }}/.config/qt5ct/qt5ct.conf"
    section: Appearance
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0644"
  become: false
  loop:
    - option: custom_palette
      value: "true"
    - option: color_scheme_path
      value: "{{ invoking_home }}/.config/qt5ct/colors/catppuccin-mocha-mauve.conf"

- name: Create GTK settings directories
  ansible.builtin.file:
    path: "{{ invoking_home }}/.config/{{ item }}"
    state: directory
    mode: "0755"
  become: false
  loop:
    - gtk-3.0
    - gtk-4.0

- name: Apply GTK theme to GTK3/4 apps
  community.general.ini_file:
    path: "{{ invoking_home }}/.config/{{ item }}/settings.ini"
    section: Settings
    option: gtk-theme-name
    value: catppuccin-mocha-mauve-standard+default
    mode: "0644"
  become: false
  loop:
    - gtk-3.0
    - gtk-4.0

- name: Create nitrogen config directory
  ansible.builtin.file:
    path: "{{ invoking_home }}/.config/nitrogen"
    state: directory
    mode: "0755"
  become: false

- name: Fetch a Catppuccin Mocha wallpaper
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/iQuickDev/catppuccin-wallpapers/master/minimalistic/mauve-cat.png
    dest: /usr/share/wallpapers/catppuccin-mocha.png
    mode: "0644"

- name: Seed nitrogen's saved background to the Catppuccin wallpaper
  ansible.builtin.copy:
    dest: "{{ invoking_home }}/.config/nitrogen/bg-saved.cfg"
    content: |
      [xin_-1]
      file=/usr/share/wallpapers/catppuccin-mocha.png
      mode=5
      bgcolor=#1E1E2E
    mode: "0644"
  become: false

- name: Generate betterlockscreen's cached lock wallpaper
  ansible.builtin.command: betterlockscreen -u /usr/share/wallpapers/catppuccin-mocha.png
  become: false
