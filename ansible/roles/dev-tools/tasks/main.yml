---
- name: Install rustup (stable toolchain — needed for eww/prism-tui; apt's rustc is too old for prism-tui)
  ansible.builtin.shell: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
  args:
    creates: "{{ invoking_home }}/.cargo/bin/rustup"
  become: false
  environment:
    HOME: "{{ invoking_home }}"

- name: Install pip user packages
  ansible.builtin.pip:
    name: "{{ pip_user_packages }}"
    extra_args: --user --break-system-packages
  become: false

- name: Install npm global packages
  community.general.npm:
    name: "{{ item }}"
    global: true
  loop: "{{ npm_global_packages }}"
  when: npm_global_packages | length > 0

- name: Check if Claude Code is installed
  ansible.builtin.command: which claude
  register: claude_check
  ignore_errors: true
  changed_when: false
  become: false

- name: Install Claude Code via official installer
  ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash
  become: false
  when: claude_check.rc != 0

- name: Add Claude Code plugin marketplaces
  ansible.builtin.command: claude plugin marketplace add {{ item }}
  loop: "{{ claude_marketplaces }}"
  register: marketplace_add
  changed_when: "'already' not in marketplace_add.stdout"
  failed_when: marketplace_add.rc != 0 and 'already' not in marketplace_add.stdout
  become: false

- name: Install Claude Code plugins
  ansible.builtin.command: claude plugin install {{ item }} -y --scope user
  loop: "{{ claude_plugins }}"
  register: plugin_install
  changed_when: "'already' not in plugin_install.stdout"
  failed_when: plugin_install.rc != 0 and 'already' not in plugin_install.stdout
  become: false
