---
- name: Ensure pipx is available
  ansible.builtin.apt:
    name: pipx
    state: present

- name: Install colorice via pipx
  ansible.builtin.command: pipx install colorice
  register: colorice_install
  changed_when: "'installed package' in colorice_install.stdout"
  failed_when: colorice_install.rc != 0 and 'already seems to be installed' not in colorice_install.stderr
  become: false

- name: Check if colorice templates are already initialized
  ansible.builtin.stat:
    path: "{{ invoking_home }}/.config/colorice/config.toml"
  register: colorice_config
  become: false

- name: Run colorice --init to drop bundled templates and starter config
  ansible.builtin.command: colorice --init
  become: false
  when: not colorice_config.stat.exists

- name: Deploy colorice config.toml
  ansible.builtin.copy:
    src: config.toml
    dest: "{{ invoking_home }}/.config/colorice/config.toml"
    mode: "0644"
  become: false

- name: Seed placeholder colorice output files (never overwrites a real apply)
  ansible.builtin.copy:
    src: "seed/{{ item.src }}"
    dest: "{{ invoking_home }}/{{ item.dest }}"
    mode: "0644"
    force: false
  become: false
  loop:
    - { src: i3-colorice-colors.conf, dest: .config/i3/colorice-colors.conf }
    - { src: i3-colorice-extended.conf, dest: .config/i3/colorice-extended.conf }
    - { src: polybar-colorice-colors.ini, dest: .config/polybar/colorice-colors.ini }
    - { src: polybar-colorice-extended.ini, dest: .config/polybar/colorice-extended.ini }
    - { src: rofi-colorice-extended.rasi, dest: .config/rofi/colorice-extended.rasi }

- name: Deploy colorice custom templates
  ansible.builtin.copy:
    src: "templates/{{ item }}"
    dest: "{{ invoking_home }}/.config/colorice/templates/{{ item }}"
    mode: "0644"
  become: false
  loop:
    - i3-extended.conf
    - polybar-extended.ini
    - rofi-extended.rasi
    - fastfetch.jsonc
    - atuin.toml
    - atuin-theme.toml
    - bat.tmTheme
    - btop.theme
    - eza.yml
    - lazygit.yml
    - mpv.conf
    - ncspot.toml
    - starship.toml
