# colorice extended palette — generated from {wallpaper}
# Included by ~/.config/i3/config after the base $rosewater...$crust block.
# This i3 config references named Catppuccin roles directly ($mauve, $base,
# $peach, etc.) rather than colorice's native $color0-15/$background names,
# so this template redefines all 26 of those names — colorice's bundled
# i3-colors.conf template's $color0-15/$background/$foreground/$cursor
# output is still generated (config.toml's "i3" entry) but nothing in this
# i3 config references those names, so it's inert here by design.
set $rosewater {color1.lighten_30.desaturate_20}
set $flamingo  {color1.lighten_20.desaturate_15}
set $pink      {color5}
set $mauve     {color5.saturate_15}
set $red       {color1}
set $maroon    {color1.darken_10}
set $peach     {color3.darken_5.saturate_15}
set $yellow    {color3}
set $green     {color2}
set $teal      {color6}
set $sky       {color6.lighten_10}
set $sapphire  {color6.darken_5.saturate_10}
set $blue      {color4}
set $lavender  {color4.lighten_15.desaturate_10}
set $text      {foreground}
set $subtext1  {color7}
set $subtext0  {color15}
set $overlay2  {color7.darken_10}
set $overlay1  {color8.lighten_20}
set $overlay0  {color8.lighten_10}
set $surface2  {color8}
set $surface1  {color0}
set $surface0  {background.lighten_5}
set $base      {background}
set $mantle    {background.darken_5}
set $crust     {background.darken_10}
