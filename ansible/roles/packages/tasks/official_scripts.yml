---
- name: Check if starship is installed
  ansible.builtin.command: which starship
  register: starship_check
  ignore_errors: true
  changed_when: false

- name: Install starship via official script
  ansible.builtin.shell: curl -sS https://starship.rs/install.sh | sh -s -- --yes
  when: starship_check.rc != 0

- name: Check if tailscale is installed
  ansible.builtin.command: which tailscale
  register: tailscale_check
  ignore_errors: true
  changed_when: false

- name: Install tailscale via official script
  ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
  when: tailscale_check.rc != 0

- name: Check if chezmoi is installed
  ansible.builtin.command: which chezmoi
  register: chezmoi_check
  ignore_errors: true
  changed_when: false

- name: Install chezmoi via official script
  ansible.builtin.shell: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
  when: chezmoi_check.rc != 0

- name: Check if uv is installed
  ansible.builtin.command: which uv
  register: uv_check
  ignore_errors: true
  changed_when: false

- name: Install uv via official script
  ansible.builtin.shell: curl -LsSf https://astral.sh/uv/install.sh | sh
  become: false
  when: uv_check.rc != 0

- name: Check if rustup/cargo is installed
  ansible.builtin.stat:
    path: "{{ invoking_home }}/.cargo/bin/cargo"
  become: false
  register: cargo_stat

- name: Install rustup (Rust toolchain, needed for cargo-only packages)
  ansible.builtin.shell: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
  become: false
  when: not cargo_stat.stat.exists

- name: Install cargo packages
  community.general.cargo:
    name: "{{ item }}"
    state: present
    executable: "{{ invoking_home }}/.cargo/bin/cargo"
  become: false
  loop: "{{ cargo_packages }}"
  loop_control:
    label: "{{ item }}"
  when: cargo_packages | length > 0
