---
apt_packages:
  # core CLI (carried from old apt.txt)
  - curl
  - eza
  - bat
  - fd-find
  - ripgrep
  - fzf
  - zoxide
  - tmux
  - mosh
  - jq
  - git
  - gh
  - zsh
  - p7zip-full
  - unrar-free
  - ffmpeg
  - python3
  - python3-pip
  - python3-venv
  - openjdk-21-jdk
  - openssh-server
  - docker.io
  - docker-compose
  - unzip
  - imagemagick
  - git-delta
  - meld
  - duf
  - smartmontools
  - hdparm
  - ncdu
  - btop
  - glances

  # TUI-first picks
  - zathura
  - mpv
  - transmission-cli
  - cava

  # firewall / disk / archive
  - ufw
  - gparted

  # remote/GUI exceptions with no TUI equivalent
  - dolphin
  - remmina
  - remmina-plugin-rdp
  - remmina-plugin-vnc
  - filezilla
  - gimp
  - kdenlive
  - obs-studio
  - nextcloud-desktop
  - libnotify-bin
  - gwenview
  - ark

  # office/audio
  - pavucontrol

  # not in Debian apt — installed separately (see packages_manual role tasks):
  #   starship, tailscale, chezmoi, ncspot, lazygit,
  #   yt-dlp, atuin, jrnl, glow, mangohud, ventoy, zen browser,
  #   vesktop, telegram, zapzap, easyeffects (flatpak), gnome-boxes,
  #   openrgb, reaper, catppuccin-cursors, catppuccin-papirus-folders,
  #   scrcpy (not resolving on this apt mirror, check sources.list),
  #   bandwhich, yazi, bluetuith (github releases below),
  #   tremc (pip), bitwarden-cli (npm), barrier (dropped, unmaintained
  #   upstream — see input-leap flatpak), prismlauncher (flatpak)

github_release_binaries:
  - repo: jesseduffield/lazygit
    asset_pattern: "lazygit_.*_linux_x86_64.tar.gz"
    binary_name: lazygit
  - repo: hrkfdn/ncspot
    asset_pattern: "ncspot-.*-linux-x86_64.tar.gz"
    binary_name: ncspot
  - repo: yt-dlp/yt-dlp
    asset_pattern: "yt-dlp_linux"
    binary_name: yt-dlp
    direct_binary: true
  - repo: atuinsh/atuin
    asset_pattern: "atuin-x86_64-unknown-linux-gnu.tar.gz"
    binary_name: atuin
  - repo: ventoy/Ventoy
    asset_pattern: "ventoy-.*-linux.tar.gz"
    binary_name: Ventoy2Disk.sh
  - repo: imsnif/bandwhich
    asset_pattern: "bandwhich-v.*-x86_64-unknown-linux-musl.tar.gz"
    binary_name: bandwhich
  - repo: sxyazi/yazi
    asset_pattern: "yazi-x86_64-unknown-linux-musl.zip"
    binary_name: yazi
  - repo: darkhz/bluetuith
    asset_pattern: "bluetuith_.*_Linux_x86_64.tar.gz"
    binary_name: bluetuith

flatpak_apps:
  - dev.vencord.Vesktop
  - org.telegram.desktop
  - com.rtosta.zapzap
  - com.github.wwmm.easyeffects
  - org.gnome.Boxes
  - org.prismlauncher.PrismLauncher
  - io.github.input_leap.input-leap

plasma_packages:
  - plasma-desktop
  - sddm
  - kwin-wayland
  - plasma-nm
  - bluedevil
  - kde-spectacle
  - konsole
  - kitty
  - kde-config-gtk-style
  - kpackagetool6

theme_packages:
  - papirus-icon-theme
  - fonts-jetbrains-mono

pip_user_packages:
  - beautifulsoup4
  - curl_cffi
  - git-filter-repo
  - numpy
  - pandas
  - peewee
  - pillow
  - prompt_toolkit
  - protobuf
  - pyarrow
  - python-dateutil
  - python-dotenv
  - pytz
  - questionary
  - SQLAlchemy
  - six
  - soupsieve
  - websockets
  - pytest
  - tremc

npm_global_packages:
  - "@bitwarden/cli"
