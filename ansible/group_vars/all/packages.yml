---
apt_packages:
  # core CLI (carried from old apt.txt)
  - curl
  - eza
  - bat
  - fd-find
  - ripgrep
  - fzf
  - zoxide
  - tmux
  - mosh
  - jq
  - git
  - gh
  - zsh
  - p7zip-full
  - unrar-free
  - ffmpeg
  - python3
  - python3-pip
  - python3-venv
  - openjdk-21-jdk
  - openssh-server
  - docker.io
  - docker-compose
  - unzip
  - imagemagick
  - git-delta
  - duf
  - smartmontools
  - hdparm
  - ncdu
  - btop
  - chafa
  - lftp
  - rclone
  - pulsemixer
  - mangohud
  - taskwarrior
  - calcurse
  - xclip
  - playerctl

  # TUI-first picks
  - zathura
  - mpv
  - transmission-cli
  - cava

  # firewall / disk / archive
  - ufw
  - gparted

  # remote/GUI exceptions with no TUI equivalent
  - remmina
  - remmina-plugin-rdp
  - remmina-plugin-vnc
  - gimp
  - kdenlive
  - obs-studio
  - libnotify-bin

  # gaming (needs contrib + non-free-firmware + i386 multiarch, see
  # steam_prereqs.yml)
  - steam-installer

  # not in Debian apt — installed separately (see packages_manual role tasks):
  #   starship, tailscale, chezmoi, ncspot, lazygit,
  #   yt-dlp, atuin, jrnl, glow, ventoy,
  #   vesktop, telegram, zapzap, easyeffects (flatpak), gnome-boxes,
  #   openrgb, reaper, catppuccin-cursors, catppuccin-papirus-folders,
  #   scrcpy (not resolving on this apt mirror, check sources.list),
  #   bandwhich, yazi, bluetuith, steam-tui (github releases below),
  #   tremc, jrnl (pip), bitwarden-cli (npm), barrier (dropped,
  #   unmaintained upstream — see input-leap flatpak), prismlauncher,
  #   osu! (flatpak)

github_release_binaries:
  - repo: jesseduffield/lazygit
    asset_pattern: "lazygit_.*_linux_x86_64.tar.gz"
    binary_name: lazygit
  - repo: hrkfdn/ncspot
    asset_pattern: "ncspot-.*-linux-x86_64.tar.gz"
    binary_name: ncspot
  - repo: yt-dlp/yt-dlp
    asset_pattern: "yt-dlp_linux"
    binary_name: yt-dlp
    direct_binary: true
  - repo: atuinsh/atuin
    asset_pattern: "atuin-x86_64-unknown-linux-gnu.tar.gz"
    binary_name: atuin
  - repo: ventoy/Ventoy
    asset_pattern: "ventoy-.*-linux.tar.gz"
    binary_name: Ventoy2Disk.sh
  - repo: imsnif/bandwhich
    asset_pattern: "bandwhich-v.*-x86_64-unknown-linux-musl.tar.gz"
    binary_name: bandwhich
  - repo: sxyazi/yazi
    asset_pattern: "yazi-x86_64-unknown-linux-musl.zip"
    binary_name: yazi
  - repo: darkhz/bluetuith
    asset_pattern: "bluetuith_.*_Linux_x86_64.tar.gz"
    binary_name: bluetuith
  - repo: dmadisetti/steam-tui
    asset_pattern: "steam-tui"
    binary_name: steam-tui
    direct_binary: true

flatpak_apps:
  - io.github.zen_browser.zen
  - sh.ppy.osu
  - dev.vencord.Vesktop
  - org.telegram.desktop
  - com.rtosta.zapzap
  - com.github.wwmm.easyeffects
  - org.gnome.Boxes
  - org.prismlauncher.PrismLauncher
  - io.github.input_leap.input-leap

i3_packages:
  - xserver-xorg
  - xinit
  - i3-wm
  - i3lock
  - polybar
  - rofi
  - picom
  - dunst
  - lightdm
  - lightdm-gtk-greeter
  - network-manager-gnome
  - blueman
  - flameshot
  - lxpolkit
  - lxappearance
  - qt5ct
  - thunar
  - thunar-archive-plugin
  - nitrogen
  - dex
  - light
  - pulseaudio-utils
  - neovim
  - fastfetch

theme_packages:
  - papirus-icon-theme
  - qt-style-kvantum

pip_user_packages:
  - beautifulsoup4
  - curl_cffi
  - git-filter-repo
  - numpy
  - pandas
  - peewee
  - pillow
  - prompt_toolkit
  - protobuf
  - pyarrow
  - python-dateutil
  - python-dotenv
  - pytz
  - questionary
  - SQLAlchemy
  - six
  - soupsieve
  - websockets
  - pytest
  - tremc
  - jrnl

npm_global_packages:
  - "@bitwarden/cli"
