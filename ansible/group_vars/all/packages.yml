  - eza
  - bat
  - fd-find
  - ripgrep
  - fzf
  - zoxide
  - tmux
  - mosh
  - jq
  - git
  - gh
  - zsh
  - p7zip-full
  - p7zip-rar
  - ffmpeg
  - python3
  - python3-pip
  - python3-venv
  - openjdk-21-jdk
  - openssh-server
  - docker.io
  - docker-compose-v2
  - unzip
  - imagemagick
  - git-delta
  - meld
  - scrcpy
  - duf
  - smartmontools
  - hdparm
  - ncdu
  - bandwhich
  - btop
  - glances

  # TUI-first picks
  - yazi
  - bluetuith
  - zathura
  - mpv
  - transmission-cli
  - tremc
  - cava

  # firewall / disk / archive
  - ufw
  - gparted

  # remote/GUI exceptions with no TUI equivalent
  - dolphin
  - remmina
  - remmina-plugin-rdp
  - remmina-plugin-vnc
  - filezilla
  - gimp
  - kdenlive
  - obs-studio
  - nextcloud-desktop
  - libnotify-bin
  - gwenview
  - ark

  # office/audio
  - pavucontrol

  # password manager CLI
  - bitwarden-cli

  # KVM sharing / minecraft launcher
  - barrier
  - prismlauncher

  # not in Debian apt — installed separately (see packages_manual role tasks):
  #   starship, tailscale, google-chrome-stable, chezmoi, ncspot, lazygit,
  #   yt-dlp, atuin, jrnl, glow, mangohud, ventoy, vscode, zen browser,
  #   vesktop, telegram, zapzap, easyeffects (flatpak), gnome-boxes,
  #   openrgb, reaper, catppuccin-cursors, catppuccin-papirus-folders

github_release_binaries:
  - repo: jesseduffield/lazygit
    asset_pattern: "lazygit_.*_Linux_x86_64.tar.gz"
    binary_name: lazygit
  - repo: hrkfdn/ncspot
    asset_pattern: "ncspot-.*-linux.tar.gz"
    binary_name: ncspot
  - repo: yt-dlp/yt-dlp
    asset_pattern: "yt-dlp_linux"
    binary_name: yt-dlp
    direct_binary: true
  - repo: atuinsh/atuin
    asset_pattern: "atuin-x86_64-unknown-linux-gnu.tar.gz"
    binary_name: atuin
  - repo: ventoy/Ventoy
    asset_pattern: "ventoy-.*-linux.tar.gz"
    binary_name: Ventoy2Disk.sh

flatpak_apps:
  - dev.vencord.Vesktop
  - org.telegram.desktop
  - com.rtosta.zapzap
  - com.github.wwmm.easyeffects
  - org.gnome.Boxes

plasma_packages:
  - plasma-desktop
  - sddm
  - kwin-wayland
  - plasma-nm
  - bluedevil
  - kde-spectacle
  - konsole
  - kitty
  - kde-config-gtk-style
  - kpackagetool6

theme_packages:
  - papirus-icon-theme
  - fonts-jetbrains-mono

pip_user_packages:
  - beautifulsoup4
  - curl_cffi
  - git-filter-repo
  - numpy
  - pandas
  - peewee
  - pillow
  - prompt_toolkit
  - protobuf
  - pyarrow
  - python-dateutil
  - python-dotenv
  - pytz
  - questionary
  - SQLAlchemy
  - six
  - soupsieve
  - websockets
  - pytest

npm_global_packages: []
