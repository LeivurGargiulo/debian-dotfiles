# Monokai Pro — ducker (github.com/robertpsoane/ducker) theme.
# Color fields deserialize plain #RRGGBB hex; use_theme: true is required
# or ducker falls back to its hardcoded palette.
theme:
  use_theme: true
  title: "#ab9df2"
  help: "#78dce8"
  background: "#2d2a2e"
  footer: "#78dce8"
  success: "#a9dc76"
  error: "#ff6188"
  positive_highlight: "#a9dc76"
  negative_highlight: "#ff6188"
