# Monokai Pro, two-line layout (directory/git/status on line 1, prompt
# character on line 2 — same shape as the p10k "classic" style this
# replaces). Multi-line `format` + add_newline=false verified against
# starship.rs/config/ (custom format strings use embedded newlines;
# add_newline=false avoids a doubled blank line on top of that).
add_newline = false

format = """
[](fg:#221f22)$os$username[](bg:#221f22 fg:#ab9df2)$directory[](fg:#221f22 bg:#ab9df2)$git_branch$git_status[](fg:#221f22) $cmd_duration$time
$character"""

palette = "monokai-pro"

[palettes.monokai-pro]
bg = "#2d2a2e"
bg_dark = "#221f22"
fg = "#fcfcfa"
dim = "#939293"
pink = "#ff6188"
orange = "#fc9867"
yellow = "#ffd866"
green = "#a9dc76"
cyan = "#78dce8"
purple = "#ab9df2"

[os]
disabled = false
style = "bg:#221f22 fg:#78dce8"

[os.symbols]
Arch = "󰣇 "

[username]
style_user = "bg:#221f22 fg:#fcfcfa"
style_root = "bg:#221f22 fg:#ff6188"
format = "[$user]($style)"
disabled = false
show_always = false

[directory]
style = "bg:#221f22 fg:#ab9df2"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "bg:#ab9df2 fg:#2d2a2e"
format = "[ $symbol$branch ]($style)"
symbol = " "

[git_status]
style = "bg:#ab9df2 fg:#2d2a2e"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "\\$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[character]
success_symbol = "[➜](bold #a9dc76)"
error_symbol = "[➜](bold #ff6188)"
vimcmd_symbol = "[❮](bold #78dce8)"

[cmd_duration]
style = "fg:#ffd866"
format = "took [$duration]($style) "
min_time = 2000

[time]
disabled = false
style = "fg:#939293"
format = "[$time]($style)"
time_format = "%R"
